name: Build Firmware

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main

# Builds commit generated bins/index files back to the branch, so two builds
# running at once race on the final rebase/push and fail with rename/delete
# conflicts on the (per-commit-hash) binary files. Serialize per ref: a new run
# waits for the in-flight one to finish instead of running concurrently.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0  

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make python3 yq unzip wget gcc-arm-none-eabi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache Silicon Labs Tools
      uses: actions/cache@v3
      with:
        path: silabs_tools
        key: silabs-tools-2025.6.2

    - name: Cache Telink Tools
      uses: actions/cache@v3
      with:
        path: telink_tools
        key: telink-tools-v3.7.2.0

    - name: Cache Python Virtual Environment
      uses: actions/cache@v3
      with:
        path: .venv
        key: python-venv-${{ hashFiles('requirements.txt') }}

    # www.silabs.com has taken to refusing downloads from GitHub's runners, and
    # the Silabs tools only survive in the cache while they are used weekly. A
    # release then used to die here, before building anything, although most
    # boards are Telink and need nothing from Silabs. Now a failed Silabs
    # install is reported and the build carries on without those boards; their
    # previous firmware stays published (see "Clear out index files").
    - name: Install SDK and Toolchain
      run: |
        make telink/tools/all setup_venv
        if make silabs/tools/all; then
          echo "SILABS_TOOLS=1" >> "$GITHUB_ENV"
        else
          echo "dumping log:"
          cat silabs_tools/slc-cli/bin/slc-cli/configuration/*.log 2>/dev/null || true
          # Do not let the cache keep a half-installed toolset.
          rm -rf silabs_tools
          echo "SILABS_TOOLS=0" >> "$GITHUB_ENV"
          echo "::warning::Silicon Labs tools could not be installed. Silabs boards are skipped in this build and keep their previously published firmware."
        fi

    - name: Clear out index files
      run: |
        source .venv/bin/activate
        if [ "$SILABS_TOOLS" = "1" ]; then
          make tools/clean_z2m_index
        else
          make tools/clean_z2m_index KEEP_MCU=EFR32
        fi

    - name: Build for all boards
      run: |
        source .venv/bin/activate
        yq -r 'to_entries | sort_by(.key)[] | "\(.key) \(.value.device_type) \(.value.build) \(.value.mcu)"' device_db.yaml | while read ITER TYPE BUILD MCU; do

          if [ "$BUILD" = "no" ]; then
            echo "Skipping $ITER as building this model is disabled in the db."
            continue
          fi

          if [ "$SILABS_TOOLS" != "1" ] && [ "${MCU#EFR32}" != "$MCU" ]; then
            echo "Skipping $ITER: no Silicon Labs tools in this build."
            continue
          fi
  
          echo "Building for board: $ITER (router)"
          BOARD=$ITER DEVICE_TYPE=router make board/build || exit 1
          echo "Checking if files were created for board: $ITER (router)"
          ls -l bin/router/$ITER/

          if [ "$TYPE" = "end_device" ]; then
            echo "Building for board: $ITER (end_device)"
            BOARD=${ITER} DEVICE_TYPE=end_device make board/build || exit 1
            echo "Checking if files were created for board: $ITER (end_device)"
            ls -l bin/end_device/${ITER}_END_DEVICE/
          fi
        done

    - name: Update Z2M converters
      run: |
        source .venv/bin/activate
        make tools/update_converters

    - name: Update ZHA quirks
      run: |
        source .venv/bin/activate
        make tools/update_zha_quirk

    - name: Update HOMEd extensions
      run: |
        source .venv/bin/activate
        make tools/update_homed_extension

    - name: Update supported_devices.md
      run: |
        source .venv/bin/activate
        make tools/update_supported_devices

    - name: Commit changes
      run: |
        source .venv/bin/activate
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bin/* zigbee2mqtt/* zha/* homed/* docs/supported_devices.md
        git diff --cached --quiet || git commit -m "Update firmware files, converters, quirks, extensions and supported devices list"
        make tools/freeze_ota_links
        git add zigbee2mqtt/*
        git diff --cached --quiet || git commit -m "Freeze links in OTA index files"
        git fetch origin
        git rebase origin/$(git rev-parse --abbrev-ref HEAD)
        git push
